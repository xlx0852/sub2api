openapi: 3.1.0
info:
  title: Sub2API Control Plane
  description: |
    Control-plane HTTP contract for authentication, end-user, and payment APIs.
    Gateway protocol endpoints (OpenAI / Anthropic / Gemini compatible) are excluded.
    Admin APIs are added in later batches. Schemas are envelope-level in this first slice;
    request/response fields will be tightened when the TypeScript client is generated.
  version: 0.1.0
servers:
  - url: /
tags:
  - name: auth
    description: Registration, login, session, and OAuth
  - name: user
    description: Profile, API keys, usage, redeem, and public settings
  - name: payment
    description: Checkout, orders, public resume, and provider webhooks
paths:
  /api/v1/announcements:
    get:
      operationId: getAnnouncements
      tags: [user]
      summary: GET /api/v1/announcements
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIEnvelope'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/announcements/{id}/read:
    post:
      operationId: postAnnouncementsIdRead
      tags: [user]
      summary: POST /api/v1/announcements/:id/read
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/idPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
