components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    idPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    providerPath:
      name: provider
      in: path
      required: true
      schema:
        type: string
  schemas:
    APIEnvelope:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: 0 indicates success
        message:
          type: string
        data: {}
    ErrorEnvelope:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
    LooseObject:
      type: object
      additionalProperties: true
      description: Placeholder request body; field contracts land with generated clients.
