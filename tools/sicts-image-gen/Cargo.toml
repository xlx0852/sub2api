[package]
name = "sicts-image-gen"
version = "0.1.2"
edition = "2021"
description = "Lightweight SicTs / Sub2API Images API CLI for Codex skill fallback"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
