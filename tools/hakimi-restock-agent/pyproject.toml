[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hakimi-restock"
version = "0.1.0"
description = "Buy accounts from Hakimi and import them into a local Sub2API pool without sharing the admin key."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.scripts]
hakimi-restock = "hakimi_restock.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
