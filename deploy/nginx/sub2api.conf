# Official Sub2API reverse-proxy reference for separated frontend/API deploys.
# Pair with deploy/docker-compose.separated.yml or any static host + API process.
#
# Requirements covered:
#   - SSE: proxy_buffering off (and X-Accel-Buffering: no from upstream is honored)
#   - WebSocket: Upgrade / Connection headers
#   - OpenAI-style underscore headers: underscores_in_headers on
#
# Same-origin topology (this file): browser talks only to nginx.
# Split-origin: serve the static files elsewhere and set CORS_ALLOWED_ORIGINS
# on the API process to that console origin.

underscores_in_headers on;
client_max_body_size 100m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream sub2api_api {
    server sub2api:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed frontend assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /logo.png {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Control plane, setup wizard, health, and all gateway protocol surfaces.
    location ^~ /api/          { proxy_pass http://sub2api_api; include /etc/nginx/sub2api-proxy.inc; }
    location ^~ /setup/        { proxy_pass http://sub2api_api; include /etc/nginx/sub2api-proxy.inc; }
    location = /health         { proxy_pass http://sub2api_api; include /etc/nginx/sub2api-proxy.inc; }
    location ^~ /v1/           { proxy_pass http://sub2api_api; include /etc/nginx/sub2api-proxy.inc; }
    location ^~ /v1beta/       { proxy_pass http://sub2api_api; include /etc/nginx/sub2api-proxy.inc; }
    location ^~ /backend-api/  { proxy_pass http://sub2api_api; include /etc/nginx/sub2api-proxy.inc; }
    location ^~ /antigravity/  { proxy_pass http://sub2api_api; include /etc/nginx/sub2api-proxy.inc; }
    location = /models         { proxy_pass http://sub2api_api; include /etc/nginx/sub2api-proxy.inc; }
    location ^~ /chat/         { proxy_pass http://sub2api_api; include /etc/nginx/sub2api-proxy.inc; }
    location = /embeddings     { proxy_pass http://sub2api_api; include /etc/nginx/sub2api-proxy.inc; }
    location ^~ /embeddings/   { proxy_pass http://sub2api_api; include /etc/nginx/sub2api-proxy.inc; }
    location = /responses      { proxy_pass http://sub2api_api; include /etc/nginx/sub2api-proxy.inc; }
    location ^~ /responses/    { proxy_pass http://sub2api_api; include /etc/nginx/sub2api-proxy.inc; }
    location = /alpha/search   { proxy_pass http://sub2api_api; include /etc/nginx/sub2api-proxy.inc; }
    location ^~ /videos/       { proxy_pass http://sub2api_api; include /etc/nginx/sub2api-proxy.inc; }
    location ^~ /images/       { proxy_pass http://sub2api_api; include /etc/nginx/sub2api-proxy.inc; }

    # SPA shell. Public config is fetched from GET /api/v1/public/config.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
