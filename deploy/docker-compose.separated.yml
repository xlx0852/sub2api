# =============================================================================
# Deprecated separated frontend / API overlay
# =============================================================================
# The base docker-compose.yml is separated by default. This overlay is retained
# so existing automation that names it keeps working:
#
#   docker compose -f docker-compose.yml -f docker-compose.separated.yml up -d
#
# It only permits explicit image overrides; it no longer changes topology.
# =============================================================================

services:
  sub2api:
    image: ${BACKEND_IMAGE:-weishaw/sub2api:latest}
    environment:
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}

  sub2api-web:
    image: ${FRONTEND_IMAGE:-weishaw/sub2api-frontend:latest}
