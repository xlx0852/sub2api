# =============================================================================
# Sub2API separated frontend / API overlay
# =============================================================================
# Does not replace docker-compose.yml. Use both files:
#
#   docker compose -f docker-compose.yml -f docker-compose.separated.yml up -d
#
# The API container stays on the internal network. Nginx publishes the host
# port, serves the static console, and proxies /api, /v1, SSE, and WebSocket.
#
# Requires Docker Compose v2.24+ (`ports: !reset` to unpublish the API port).
# =============================================================================

services:
  sub2api:
    ports: !reset []
    expose:
      - "8080"
    environment:
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}

  sub2api-web:
    image: nginx:1.27-alpine
    container_name: sub2api-web
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${SERVER_PORT:-8080}:80"
    volumes:
      - ./nginx/sub2api.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/sub2api-proxy.inc:/etc/nginx/sub2api-proxy.inc:ro
      - ${FRONTEND_DIST:-./frontend-dist}:/usr/share/nginx/html:ro
    depends_on:
      sub2api:
        condition: service_healthy
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
